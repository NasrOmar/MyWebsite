<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nasr.ai — an independent AI assistant powered by DeepSeek.">
  <meta name="theme-color" content="#111318">
  <title>Nasr.ai</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <style>
    :root {
      color-scheme: dark light;
      --bg: #111318;
      --sidebar: #17191f;
      --panel: #1c1f26;
      --panel-2: #232730;
      --line: #2d323d;
      --text: #f3f5f7;
      --muted: #9aa2b1;
      --accent: #5b7cfa;
      --accent-hover: #4e6fe8;
      --danger: #ff8d8d;
      --shadow: 0 14px 40px rgba(0,0,0,.24);
      --topbar-bg: rgba(17,19,24,.92);
      --composer-fade: rgba(17,19,24,0);
      --faint-panel: rgba(255,255,255,.025);
      --overlay: rgba(0,0,0,.48);
      --logo-bg: #ffffff;
      --logo-border: #d8dbe2;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f8fa;
        --sidebar: #ffffff;
        --panel: #ffffff;
        --panel-2: #eef1f5;
        --line: #dfe3ea;
        --text: #17191f;
        --muted: #687080;
        --accent: #4267e8;
        --accent-hover: #3458d4;
        --danger: #c83f4d;
        --shadow: 0 14px 40px rgba(27,35,55,.12);
        --topbar-bg: rgba(247,248,250,.92);
        --composer-fade: rgba(247,248,250,0);
        --faint-panel: rgba(20,28,45,.035);
        --overlay: rgba(20,25,35,.35);
        --logo-bg: #ffffff;
        --logo-border: #d8dbe2;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea { font: inherit; }

    .app {
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
    }

    .sidebar {
      height: 100vh;
      overflow: hidden;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 6px;
      margin-bottom: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 100px;
      object-fit: contain;
      padding: 0;
      border: 0;
      background: var(--logo-bg);
    }

    .brand-copy h1 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: -.02em;
    }

    .brand-copy p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .75rem;
    }

    .new-chat {
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      text-align: left;
      padding: 0 14px;
      cursor: pointer;
    }

    .new-chat:hover { background: var(--panel-2); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .88rem;
      color: var(--muted);
      border: 1px solid transparent;
      transition: background .15s;
    }

    .chat-item:hover { background: var(--panel); }

    .chat-item.active {
      background: var(--panel);
      border-color: var(--line);
      color: var(--text);
    }

    .chat-item-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-item-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .chat-item:hover .chat-item-delete,
    .chat-item-delete:focus { opacity: 1; }

    .chat-item-delete:hover { color: var(--danger); }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      font-size: .76rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .sidebar-footer a {
      color: #b9c6ff;
      text-underline-offset: 3px;
    }

    .main {
      min-width: 0;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: 62px minmax(0, 1fr);
    }

    .topbar {
      height: 62px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      background: var(--topbar-bg);
      backdrop-filter: blur(10px);
    }

    .topbar-title {
      max-width: min(620px, 80%);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .95rem;
      font-weight: 650;
    }

    .conversation {
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 40px 24px 170px;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }

    .conversation-inner {
      width: min(760px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .welcome {
      padding: 42px 0 18px;
      text-align: center;
    }

    .welcome-logo {
      width: 64px;
      height: 64px;
      border-radius: 100px;
      object-fit: contain;
      padding: 0;
      border: 0;
      background: var(--logo-bg);
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .welcome h2 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      letter-spacing: -.04em;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
    }

    .message-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .message-row.user-row { justify-content: flex-end; }

    .avatar {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 100px;
      border: 0;
      object-fit: contain;
      padding: 0;
      background: var(--logo-bg);
    }

    .user-avatar {
      display: grid;
      place-items: center;
      font-size: .7rem;
      font-weight: 700;
      background: var(--accent);
      color: white;
      border: 0;
      padding: 0;
    }

    .bubble {
      max-width: min(680px, 86%);
      line-height: 1.65;
      font-size: .96rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant-bubble { padding-top: 4px; }

    .user-bubble {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 15px;
    }

    .status {
      color: var(--muted);
      font-style: italic;
    }

    .error { color: var(--danger); }

    .composer-shell {
      position: fixed;
      left: 260px;
      right: 0;
      bottom: 0;
      padding: 28px 20px 18px;
      background: linear-gradient(to top, var(--bg) 68%, var(--composer-fade));
    }

    .composer-wrap {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 20px;
      padding: 10px;
      box-shadow: var(--shadow);
    }

    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 170px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 11px 12px;
      line-height: 1.5;
    }

    textarea::placeholder { color: #747d8d; }

    .send {
      align-self: end;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 800;
    }

    .send:hover { background: var(--accent-hover); }

    button:disabled, textarea:disabled {
      opacity: .48;
      cursor: not-allowed;
    }

    .composer-note {
      margin: 9px 12px 0;
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.45;
      text-align: center;
    }

    .mobile-header,
    .sidebar-overlay { display: none; }

    @media (max-width: 800px) {
      .app { display: block; }
      .sidebar { display: none; }

      .sidebar.open {
        display: flex;
        position: fixed;
        inset: 0 auto 0 0;
        width: min(280px, 86vw);
        z-index: 101;
        box-shadow: var(--shadow);
      }

      .sidebar-overlay.open {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--overlay);
      }

      .mobile-header {
        display: flex;
        height: 58px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        align-items: center;
        justify-content: space-between;
        background: var(--sidebar);
      }

      .mobile-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
      }

      .mobile-brand img {
        width: 34px;
        height: 34px;
        border-radius: 100px;
        object-fit: contain;
        padding: 0;
        border: 0;
        background: var(--logo-bg);
      }

      .mobile-menu-btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }

      .main {
        height: calc(100vh - 58px);
        min-height: 0;
      }

      .topbar { display: none; }

      .composer-shell {
        left: 0;
        padding: 24px 12px 12px;
      }

      .conversation {
        height: 100%;
        min-height: 0;
        padding: 24px 14px 170px;
      }

      .welcome { padding-top: 24px; }
      .bubble { max-width: 88%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img src="assets/logo.svg" alt="Nasr.ai logo" class="logo">
          <div class="brand-copy">
            <h1>Nasr.ai</h1>
            <p>Powered by DeepSeek</p>
          </div>
        </div>
        <button type="button" class="new-chat" id="newChatButton">＋ New chat</button>
      </div>

      <div class="chat-list" id="chatList"></div>

      <div class="sidebar-footer">
        Conversations are stored in this browser. Recent messages from the selected chat are sent to provide context.
        <br><br>
        <a href="privacy.html">Privacy Policy</a>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="mobile-header">
      <div class="mobile-brand">
        <button class="mobile-menu-btn" id="mobileMenuButton" aria-label="Open conversations">☰</button>
        <img src="assets/logo.svg" alt="">
        <span>Nasr.ai</span>
      </div>
      <button type="button" class="mobile-menu-btn" id="mobileNewChatButton">＋ New</button>
    </div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title" id="topbarTitle">Nasr.ai</div>
      </header>

      <section class="conversation" id="conversation" aria-live="polite">
        <div class="conversation-inner" id="conversationInner"></div>
      </section>

      <div class="composer-shell">
        <div class="composer-wrap">
          <form class="composer" id="chatForm">
            <textarea
              id="userInput"
              maxlength="3000"
              rows="1"
              required
              aria-label="Message Nasr.ai"
              placeholder="Message Nasr.ai"></textarea>
            <button class="send" id="sendButton" type="submit" aria-label="Send message">↑</button>
          </form>
          <p class="composer-note">
            Nasr.ai may make mistakes. Do not submit confidential or highly sensitive information.
          </p>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Replace with your deployed Vercel endpoint.
    const API_URL = "https://YOUR-PROJECT.vercel.app/api/chat";

    const STORAGE_KEY = "nasr_ai_conversations_v1";
    const MAX_STORED_CONVERSATIONS = 50;
    const MAX_MESSAGES_SENT_TO_API = 20;

    const form = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const newChatButton = document.getElementById("newChatButton");
    const mobileNewChatButton = document.getElementById("mobileNewChatButton");
    const mobileMenuButton = document.getElementById("mobileMenuButton");
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const chatList = document.getElementById("chatList");
    const conversation = document.getElementById("conversation");
    const conversationInner = document.getElementById("conversationInner");
    const topbarTitle = document.getElementById("topbarTitle");

    let conversations = {};
    let activeConversationId = null;
    let requestInProgress = false;

    function loadConversations() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        conversations = parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        conversations = {};
      }
    }

    function pruneConversations() {
      const sorted = Object.values(conversations).sort(
        (a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0)
      );

      sorted.slice(MAX_STORED_CONVERSATIONS).forEach(conversationToDelete => {
        delete conversations[conversationToDelete.id];
      });
    }

    function saveConversations() {
      try {
        pruneConversations();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
      } catch {
        // Storage may be disabled or full. The current page can still continue temporarily.
      }
    }

    function generateId() {
      return `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
    }

    function makeTitle(messages) {
      const firstUserMessage = messages.find(message => message.role === "user");
      if (!firstUserMessage) return "New conversation";

      const text = firstUserMessage.content.trim().replace(/\s+/g, " ");
      return text.length > 42 ? `${text.slice(0, 42)}…` : text;
    }

    function sortedConversations() {
      return Object.values(conversations).sort(
        (a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0)
      );
    }

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("open");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }

    function renderChatList() {
      chatList.replaceChildren();

      sortedConversations().forEach(chat => {
        const item = document.createElement("div");
        item.className = `chat-item${chat.id === activeConversationId ? " active" : ""}`;

        const title = document.createElement("span");
        title.className = "chat-item-title";
        title.textContent = chat.title || "New conversation";

        const deleteButton = document.createElement("button");
        deleteButton.className = "chat-item-delete";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.title = "Delete conversation";
        deleteButton.setAttribute("aria-label", `Delete ${chat.title || "conversation"}`);

        deleteButton.addEventListener("click", event => {
          event.stopPropagation();
          deleteConversation(chat.id);
        });

        item.addEventListener("click", () => switchConversation(chat.id));
        item.append(title, deleteButton);
        chatList.appendChild(item);
      });
    }

    function switchConversation(id) {
      if (!conversations[id] || requestInProgress) return;

      activeConversationId = id;
      renderConversation();
      renderChatList();
      updateTopbar();
      closeSidebar();
      userInput.focus();
    }

    function updateTopbar() {
      const chat = conversations[activeConversationId];
      topbarTitle.textContent = chat?.title || "Nasr.ai";
    }

    function createWelcome() {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.innerHTML = `
        <img src="assets/logo.svg" alt="Nasr.ai logo" class="welcome-logo">
        <h2>How can I help?</h2>
        <p>An independent AI assistant powered by DeepSeek.</p>
      `;
      return welcome;
    }

    function renderConversation() {
      conversationInner.replaceChildren();
      const chat = conversations[activeConversationId];

      if (!chat || !Array.isArray(chat.messages) || chat.messages.length === 0) {
        conversationInner.appendChild(createWelcome());
      } else {
        chat.messages.forEach(message => renderMessage(message.role, message.content));
      }

      scrollToBottom();
    }

    function renderMessage(role, content, extraClass = "") {
      const row = document.createElement("div");
      row.className = `message-row ${role === "user" ? "user-row" : ""}`;

      if (role === "assistant") {
        const avatar = document.createElement("img");
        avatar.src = "assets/logo.svg";
        avatar.alt = "Nasr.ai";
        avatar.className = "avatar";
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className =
        `bubble ${role === "user" ? "user-bubble" : "assistant-bubble"} ${extraClass}`.trim();
      bubble.textContent = content;
      row.appendChild(bubble);

      if (role === "user") {
        const avatar = document.createElement("div");
        avatar.className = "avatar user-avatar";
        avatar.textContent = "You";
        row.appendChild(avatar);
      }

      conversationInner.appendChild(row);
      return { row, bubble };
    }

    function scrollToBottom() {
      const performScroll = () => {
        conversation.scrollTop = conversation.scrollHeight;
      };

      performScroll();
      requestAnimationFrame(performScroll);
      setTimeout(performScroll, 0);
      setTimeout(performScroll, 80);
    }

    function createNewConversation() {
      if (requestInProgress) return;

      const id = generateId();
      const now = Date.now();

      conversations[id] = {
        id,
        title: "New conversation",
        messages: [],
        createdAt: now,
        updatedAt: now
      };

      activeConversationId = id;
      saveConversations();
      renderConversation();
      renderChatList();
      updateTopbar();
      closeSidebar();
      userInput.focus();
    }

    function deleteConversation(id) {
      if (requestInProgress) return;

      delete conversations[id];

      if (activeConversationId === id) {
        const next = sortedConversations()[0];
        activeConversationId = next?.id || null;
      }

      if (!activeConversationId) {
        createNewConversation();
        return;
      }

      saveConversations();
      renderConversation();
      renderChatList();
      updateTopbar();
    }

    function setBusy(isBusy) {
      requestInProgress = isBusy;
      userInput.disabled = isBusy;
      sendButton.disabled = isBusy;
      newChatButton.disabled = isBusy;
      mobileNewChatButton.disabled = isBusy;
    }

    async function sendMessage(message) {
      if (!activeConversationId || !conversations[activeConversationId]) {
        createNewConversation();
      }

      const requestConversationId = activeConversationId;
      const chat = conversations[requestConversationId];

      chat.messages.push({ role: "user", content: message });
      chat.title = makeTitle(chat.messages);
      chat.updatedAt = Date.now();

      saveConversations();
      renderConversation();
      renderChatList();
      updateTopbar();
      setBusy(true);

      const waiting = renderMessage("assistant", "Nasr.ai is thinking…", "status");
      scrollToBottom();

      try {
        const messagesForApi = chat.messages.slice(-MAX_MESSAGES_SENT_TO_API);

        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: messagesForApi })
        });

        let data = {};
        try { data = await response.json(); } catch {}

        if (!response.ok) {
          throw new Error(data.error || "The AI service is temporarily unavailable.");
        }

        const reply = String(data.reply || "").trim();
        if (!reply) throw new Error("The AI returned an empty response.");

        chat.messages.push({ role: "assistant", content: reply });
        chat.updatedAt = Date.now();
        saveConversations();

        if (activeConversationId === requestConversationId) {
          waiting.row.remove();
          renderMessage("assistant", reply);
          scrollToBottom();
        }

        renderChatList();
      } catch (error) {
        if (activeConversationId === requestConversationId) {
          waiting.bubble.textContent =
            error.message || "Unable to reach Nasr.ai. Please try again later.";
          waiting.bubble.classList.add("error");
          scrollToBottom();
        }
      } finally {
        setBusy(false);
        userInput.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const message = userInput.value.trim();
      if (!message || requestInProgress) return;

      userInput.value = "";
      userInput.style.height = "auto";
      sendMessage(message);
    });

    userInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = `${Math.min(userInput.scrollHeight, 170)}px`;
      scrollToBottom();
    });

    newChatButton.addEventListener("click", createNewConversation);
    mobileNewChatButton.addEventListener("click", createNewConversation);
    mobileMenuButton.addEventListener("click", openSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    loadConversations();

    const mostRecent = sortedConversations()[0];
    if (mostRecent) {
      activeConversationId = mostRecent.id;
      renderConversation();
      renderChatList();
      updateTopbar();
    } else {
      createNewConversation();
    }

    userInput.focus();
  </script>
</body>
</html>
